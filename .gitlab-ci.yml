stages:
- test

image: debian:bookworm
before_script:
  - uname -a

default:
  interruptible: true

# Shared rules for every check job: always run on master, and run when
# the CI configuration itself changes. Job rules are OR'd, so jobs also
# match their own changes rule below these.
.shared-rules:
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - changes:
    - .tools/init.sh
    - .gitlab-ci.yml

pngcheck:
  stage: test
  rules:
  - !reference [.shared-rules, rules]
  - changes:
    - "**/*.png"
    - .tools/pngcheck.sh
  script:
  - ./.tools/pngcheck.sh
  #allow_failure: true

imagemagiccheck:
  stage: test
  rules:
  - !reference [.shared-rules, rules]
  - changes:
    - "**/*.png"
    - .tools/imagemagiccheck.sh
  script:
  - ./.tools/imagemagiccheck.sh
  allow_failure: true

manaverse:
  stage: test
  tags:
  - amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
  - ./.tools/manaplus.sh mana/verse master pkg_deb manaverse.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week

old_manaplus:
  stage: test
  tags:
  - amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
  - ./.tools/manaplus.sh mana/verse old_manaplus_for_CI pkg_deb manaplus.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week
  allow_failure: true

newlines:
  stage: test
  tags:
  - lightweight
  rules:
  - !reference [.shared-rules, rules]
  - changes:
    - "**/*.xml"
    - "**/*.tmx"
    - .tools/newlines.sh
  script:
  - ./.tools/newlines.sh
  artifacts:
    paths:
    - shared
    when: always
    expire_in: 3 week
  #allow_failure: true

licensecheck:
  stage: test
  tags:
  - lightweight
  rules:
  - !reference [.shared-rules, rules]
  - changes:
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.tmx"
    - "sfx/**/*.ogg"
    - license.md
    - .tools/licensecheck.sh
  script:
  - ln -s license.md LICENSE
  - ln -s license.md ART_LICENSE
  - ./.tools/licensecheck.sh
  allow_failure: true

testxml:
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: mods
  rules:
  - !reference [.shared-rules, rules]
  - changes:
    - "**/*.xml"
    - "**/*.tmx"
    - "**/*.png"
    - .tools/testxml.sh
  script:
  - ./.tools/testxml.sh
