stages:
- test

image: debian:bookworm
before_script:
  - uname -a

default:
  interruptible: true

# This project uses branch pipelines. Without this block, jobs having
# rules also spawn a duplicate merge request pipeline for each push to
# a branch with an open MR.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - when: always

# Shared rule: changes that affect every check job. Job rules are OR'd,
# so jobs match this rule or their own changes rule below it.
.ci-config: &when-ci-config-changes
  changes:
  - .tools/init.sh
  - .gitlab-ci.yml

pngcheck:
  stage: test
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - *when-ci-config-changes
  - changes:
    - "**/*.png"
    - .tools/pngcheck.sh
  script:
  - ./.tools/pngcheck.sh
  #allow_failure: true

imagemagiccheck:
  stage: test
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - *when-ci-config-changes
  - changes:
    - "**/*.png"
    - .tools/imagemagiccheck.sh
  script:
  - ./.tools/imagemagiccheck.sh
  allow_failure: true

manaverse:
  stage: test
  tags:
  - amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
  - ./.tools/manaplus.sh mana/verse master pkg_deb manaverse.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week

old_manaplus:
  stage: test
  tags:
  - amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
  - ./.tools/manaplus.sh mana/verse old_manaplus_for_CI pkg_deb manaplus.log
  artifacts:
    paths:
    - logs
    when: always
    expire_in: 3 week
  allow_failure: true

newlines:
  stage: test
  tags:
  - lightweight
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - *when-ci-config-changes
  - changes:
    - "**/*.xml"
    - "**/*.tmx"
    - .tools/newlines.sh
  script:
  - ./.tools/newlines.sh
  artifacts:
    paths:
    - shared
    when: always
    expire_in: 3 week
  #allow_failure: true

licensecheck:
  stage: test
  tags:
  - lightweight
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - *when-ci-config-changes
  - changes:
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.tmx"
    - "sfx/**/*.ogg"
    - license.md
    - .tools/licensecheck.sh
  script:
  - ln -s license.md LICENSE
  - ln -s license.md ART_LICENSE
  - ./.tools/licensecheck.sh
  allow_failure: true

testxml:
  stage: test
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
  - *when-ci-config-changes
  - changes:
    - "**/*.xml"
    - "**/*.tmx"
    - "**/*.png"
    - .tools/testxml.sh
  script:
  - ./.tools/testxml.sh
  allow_failure: true
